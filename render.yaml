services:
  - type: web
    name: potato-disease-api
    runtime: python
    buildCommand: |
      pyenv install 3.10.13 --skip-existing
      pyenv global 3.10.13
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
